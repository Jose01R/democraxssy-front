spring.application.name=democraxssy-backend

# El backend solo escucha en loopback; Nginx hace el puente hacia afuera.
server.address=127.0.0.1
server.port=8080

# No exponer el stacktrace en las respuestas de error (se refuerza en la Fase E).
server.error.include-stacktrace=never
server.error.include-message=never
